server:
  port: ${PORT:8080}

spring:
  application:
    name: ms-warframe

  datasource:
    url: ${DB_URL}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 0

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: ${SHOW_SQL:false}

app:
  jwt:
    secret: ${JWT_SECRET}
    horas: ${JWT_HORAS:1}
  cors:
    origins: ${CORS_ORIGINS:http://localhost:5173}
  admin:
    correo: ${ADMIN_CORREO:}
    password: ${ADMIN_PASSWORD:}
