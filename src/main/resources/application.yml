server:
  port: ${PORT:8080}

spring:
  application:
    name: ms-warframe

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/neondb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 0

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}
